
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
     <nav>  
      <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ site.baseurl }}{% if link.url contains '#' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"
                 class="nav-link"
                 data-anchor="{{ link.url | replace: '#', '' }}">
                 {{ link.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.nav-link[data-anchor]').forEach(link => {
  link.addEventListener('click', function(e) {
    if(this.href.includes('#')) {
      e.preventDefault();
      const anchor = this.getAttribute('data-anchor');
      const target = document.getElementById(anchor);
      if(target) {
        const newUrl = '{{ site.baseurl }}/#' + anchor;
        // 两种跳转方式确保兼容性
        window.location.hash = anchor;
        target.scrollIntoView({ behavior: 'smooth' });
        
        // 更新浏览器地址（解决 GitHub Pages 的 baseurl 问题）
        history.pushState(null, null, '{{ site.baseurl }}/#' + anchor);
      }
    }
  });
});
</script>
